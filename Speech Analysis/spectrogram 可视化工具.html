<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声谱图终极版 (Spectrogram Ultimate)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            user-select: none;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        canvas { display: block; image-rendering: pixelated; }
        
        .control-btn {
            transition: all 0.15s ease-in-out;
        }
        .control-btn:active { transform: scale(0.95); }
        
        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #fff;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-700 h-14 flex items-center px-4 justify-between shrink-0 z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-indigo-700 rounded flex items-center justify-center text-white font-bold shadow-lg">SP</div>
            <div>
                <h1 class="font-bold text-sm leading-tight text-slate-100">声谱图终极版 <span class="text-xs text-yellow-500 ml-1">V3</span></h1>
                <div class="text-[10px] text-slate-400">Time-Travel & Analysis</div>
            </div>
        </div>

        <!-- Central Controls -->
        <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-lg border border-slate-700">
            <button id="btnStart" class="px-3 py-1 bg-green-600 hover:bg-green-500 text-white rounded text-xs font-bold shadow flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-play"></i> 启动
            </button>
            <div class="h-4 w-px bg-slate-600 mx-1"></div>
            <button id="btnPause" class="control-btn px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-xs flex items-center gap-2 disabled:opacity-50" disabled>
                <i class="fa-solid fa-pause"></i> 暂停 / 回看
            </button>
            <button id="btnSnapshot" class="control-btn px-3 py-1 bg-slate-700 hover:bg-blue-600 text-slate-200 rounded text-xs flex items-center gap-2 disabled:opacity-50" disabled title="保存截图">
                <i class="fa-solid fa-camera"></i> 截图
            </button>
             <button id="btnClear" class="control-btn px-3 py-1 bg-slate-700 hover:bg-red-600 text-slate-200 rounded text-xs flex items-center gap-2 disabled:opacity-50" disabled title="清除历史数据">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>

        <!-- Analysis Toggles -->
        <div class="flex items-center gap-4 text-xs">
            <label class="flex items-center cursor-pointer">
                <div class="relative">
                    <input type="checkbox" id="checkHarmonics" class="sr-only">
                    <div class="w-8 h-4 bg-slate-700 rounded-full shadow-inner"></div>
                    <div class="dot absolute w-2 h-2 bg-white rounded-full shadow left-1 top-1 transition"></div>
                </div>
                <div class="ml-2 text-slate-300">F0 谐波尺</div>
            </label>
            <label class="flex items-center cursor-pointer">
                <div class="relative">
                    <input type="checkbox" id="checkFormants" checked class="sr-only">
                    <div class="w-8 h-4 bg-slate-700 rounded-full shadow-inner"></div>
                    <div class="dot absolute w-2 h-2 bg-white rounded-full shadow left-1 top-1 transition"></div>
                </div>
                <div class="ml-2 text-slate-300">共振峰</div>
            </label>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col min-h-0 relative bg-black">
        
        <!-- View 1: Spectrogram -->
        <div class="flex-1 relative flex flex-col border-b border-slate-700 group overflow-hidden" id="spectrogramContainer">
            <!-- Canvas Layer -->
            <canvas id="specCanvas" class="w-full h-full block cursor-crosshair z-0"></canvas>
            <!-- Overlay Layer (Cursor, Lines) -->
            <canvas id="overlayCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10"></canvas>
            
            <!-- Floating Lock Indicator -->
            <div id="lockIndicator" class="hidden absolute top-4 right-4 bg-red-600/90 text-white px-3 py-1 rounded-full text-xs shadow-lg backdrop-blur animate-pulse z-20 pointer-events-none">
                <i class="fa-solid fa-lock mr-1"></i> 视图锁定
            </div>

            <!-- Time Travel Scrollbar (Overlay at bottom of spec) -->
            <div class="absolute bottom-0 left-0 w-full bg-slate-900/90 border-t border-slate-700 p-2 flex items-center gap-3 z-30 transition-transform duration-300 transform translate-y-full" id="timelineControls">
                <button id="btnLive" class="px-2 py-0.5 bg-blue-600 text-[10px] text-white rounded font-bold uppercase tracking-wider">LIVE</button>
                <input type="range" id="timeSlider" min="0" max="1000" value="1000" class="flex-1 h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer">
                <span id="timeLabel" class="text-[10px] text-slate-400 font-mono w-16 text-right">-00:00</span>
            </div>

            <!-- Tooltip -->
            <div id="specTooltip" class="tooltip hidden">
                <div class="flex justify-between items-baseline gap-4 mb-1">
                    <span class="font-bold text-blue-300 text-lg" id="ttFreq">0 Hz</span>
                    <span class="text-slate-300 font-mono" id="ttNote">A4</span>
                </div>
                <div class="text-[10px] text-slate-400" id="ttHint">点击锁定/解锁</div>
            </div>
        </div>

        <!-- View 2: Spectrum Slice -->
        <div class="h-40 bg-slate-900 relative flex flex-col shrink-0" id="spectrumContainer">
            <div class="absolute top-2 left-2 z-10 text-[10px] text-slate-500 font-bold uppercase tracking-widest pointer-events-none">
                Frequency Spectrum
            </div>
            <canvas id="sliceCanvas" class="w-full h-full block"></canvas>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white px-4 py-2 rounded shadow-lg border-l-4 border-green-500 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        Notification
    </div>

    <script>
        // --- Configuration ---
        const config = {
            fftSize: 2048,
            sampleRate: 44100,
            maxHistoryFrames: 3000, // Approx 45-60 seconds of history depending on refresh rate
            minDb: -90,
            maxDb: -10,
            smoothing: 0.0,
        };

        // --- State ---
        const state = {
            audioCtx: null,
            analyser: null,
            source: null,
            isRunning: false,
            isPaused: false,
            
            // Data Buffers
            history: [], // Array of Uint8Arrays
            bufferLength: 0,
            
            // View State
            viewOffset: 0, // 0 = showing latest data. Positive = looking back in history.
            canvasWidth: 0,
            canvasHeight: 0,
            
            // Interaction State
            mouseX: 0,
            mouseY: 0,
            mouseFreq: 0,
            isLocked: false, // Is the cursor locked?
            lockedX: 0,
            lockedY: 0,
            lockedFreq: 0,
            
            // Toggles
            showHarmonics: false,
            showFormants: true
        };

        // --- DOM Elements ---
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnSnapshot = document.getElementById('btnSnapshot');
        const btnClear = document.getElementById('btnClear');
        const btnLive = document.getElementById('btnLive');
        
        const specCanvas = document.getElementById('specCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const sliceCanvas = document.getElementById('sliceCanvas');
        
        const specCtx = specCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');
        const sliceCtx = sliceCanvas.getContext('2d');
        
        const specContainer = document.getElementById('spectrogramContainer');
        const timelineControls = document.getElementById('timelineControls');
        const timeSlider = document.getElementById('timeSlider');
        const timeLabel = document.getElementById('timeLabel');
        const lockIndicator = document.getElementById('lockIndicator');
        const tooltip = document.getElementById('specTooltip');
        const ttFreq = document.getElementById('ttFreq');
        const ttNote = document.getElementById('ttNote');
        const ttHint = document.getElementById('ttHint');

        // Custom CSS handling for toggle switches
        document.querySelectorAll('input[type="checkbox"]').forEach(input => {
            input.addEventListener('change', (e) => {
                const dot = e.target.parentElement.querySelector('.dot');
                if(e.target.checked) {
                    dot.style.transform = 'translateX(100%)';
                    dot.parentElement.querySelector('div:nth-child(2)').classList.add('bg-blue-600');
                    dot.parentElement.querySelector('div:nth-child(2)').classList.remove('bg-slate-700');
                } else {
                    dot.style.transform = 'translateX(0)';
                    dot.parentElement.querySelector('div:nth-child(2)').classList.remove('bg-blue-600');
                    dot.parentElement.querySelector('div:nth-child(2)').classList.add('bg-slate-700');
                }
            });
            // Init state
            input.dispatchEvent(new Event('change'));
        });

        // --- Layout ---
        function resizeCanvases() {
            const containerW = specContainer.clientWidth;
            const containerH = specContainer.clientHeight;
            const sliceH = document.getElementById('spectrumContainer').clientHeight;

            specCanvas.width = containerW;
            specCanvas.height = containerH;
            state.canvasWidth = containerW;
            state.canvasHeight = containerH;

            overlayCanvas.width = containerW;
            overlayCanvas.height = containerH;
            
            sliceCanvas.width = containerW;
            sliceCanvas.height = sliceH;

            // Re-render immediately if we have data
            if (state.history.length > 0) renderSpectrogram();
        }
        window.addEventListener('resize', resizeCanvases);

        // --- Audio Engine ---
        async function initAudio() {
            if (state.audioCtx) return;

            try {
                state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                config.sampleRate = state.audioCtx.sampleRate;
                
                state.analyser = state.audioCtx.createAnalyser();
                state.analyser.fftSize = config.fftSize;
                state.analyser.smoothingTimeConstant = config.smoothing;
                
                state.bufferLength = state.analyser.frequencyBinCount;
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.source = state.audioCtx.createMediaStreamSource(stream);
                state.source.connect(state.analyser);
                
                state.isRunning = true;
                
                // UI Update
                btnStart.classList.add('hidden');
                btnPause.disabled = false;
                btnSnapshot.disabled = false;
                btnClear.disabled = false;
                timelineControls.classList.remove('translate-y-full'); // Show timeline
                
                resizeCanvases();
                animate();
                showToast("引擎已启动 - 点击声谱图可锁定分析");

            } catch (e) {
                alert("麦克风启动失败: " + e.message);
            }
        }

        // --- Core Loop ---
        function animate() {
            if (!state.isRunning) return;
            requestAnimationFrame(animate);

            // 1. Capture Data (if not paused)
            if (!state.isPaused) {
                const dataArray = new Uint8Array(state.bufferLength);
                state.analyser.getByteFrequencyData(dataArray);
                
                // Add to History
                state.history.push(dataArray);
                if (state.history.length > config.maxHistoryFrames) {
                    state.history.shift(); // Remove oldest
                }
                
                // Auto-follow: View offset is 0 (latest)
                state.viewOffset = 0;
                updateSlider();
            }

            // 2. Render
            renderSpectrogram();
            drawOverlay(); // Cursor, lines
            drawSpectrumSlice(); // Bottom graph
        }

        // --- Rendering Logic (The hard part) ---
        
        // Helper: Generate Heatmap Palette
        // Pre-calculating color table for performance (256 colors)
        const colorTable = new Uint32Array(256); // Stores 0xAABBGGRR
        (function generateColorTable() {
            for (let i = 0; i < 256; i++) {
                let r=0, g=0, b=0;
                const p = i / 255;
                if (p > 0.05) { // Noise floor
                    // Magma-like palette
                    r = Math.min(255, Math.floor(p * 2 * 255));
                    g = Math.min(255, Math.floor((p - 0.3) * 3 * 255)); 
                    b = Math.min(255, Math.floor((p - 0.7) * 4 * 255)); 
                    // Make sure values are >= 0
                    if (g < 0) g = 0;
                    if (b < 0) b = 0;
                }
                // Little Endian: ABGR
                colorTable[i] = (255 << 24) | (b << 16) | (g << 8) | r; 
            }
        })();

        function renderSpectrogram() {
            const w = state.canvasWidth;
            const h = state.canvasHeight;
            const historyLen = state.history.length;
            
            if (historyLen === 0) return;

            // Create Image Data Buffer
            const imgData = specCtx.createImageData(w, h);
            const data32 = new Uint32Array(imgData.data.buffer); // 32-bit view for speed

            // Determine which part of history to show
            // history index 0 is OLDEST. index length-1 is NEWEST.
            // Screen X=Width is NEWEST. Screen X=0 is OLDER.
            
            // logic: The pixel at x=Width-1 corresponds to history[last - offset]
            // pixel at x=Width-1-k corresponds to history[last - offset - k]
            
            const endIndex = historyLen - 1 - state.viewOffset;
            
            // Loop through columns (Time)
            for (let x = 0; x < w; x++) {
                // Determine which history frame belongs to this column
                // We want the right side of canvas to be 'endIndex'
                // So column x corresponds to: endIndex - (w - 1 - x)
                const histIdx = endIndex - (w - 1 - x);
                
                if (histIdx >= 0 && histIdx < historyLen) {
                    const frame = state.history[histIdx];
                    
                    // Draw this column
                    // Loop through rows (Frequency). y=0 is high freq, y=h is low freq.
                    for (let y = 0; y < h; y++) {
                        // Map y to freq bin
                        // Linear mapping: 
                        // y=0 -> bin=bufferLength-1
                        // y=h -> bin=0
                        const percent = 1 - (y / h);
                        const bin = Math.floor(percent * (state.bufferLength / 2)); // Use half buffer (up to Nyquist)? Actually bufferLength is usually up to Nyquist already.
                        // state.bufferLength = fftSize/2. 
                        
                        // Let's ensure we map correctly.
                        const binIdx = Math.floor(percent * state.bufferLength);
                        
                        let val = 0;
                        if (binIdx >= 0 && binIdx < state.bufferLength) {
                            val = frame[binIdx];
                        }
                        
                        // Set pixel color
                        const pIdx = y * w + x;
                        data32[pIdx] = colorTable[val];
                    }
                } else {
                    // Out of history bounds (black)
                    // data32 is initialized to 0 (transparent/black) usually, but to be safe:
                    // Actually createImageData returns transparent black (0,0,0,0).
                    // We want opaque black.
                    for (let y = 0; y < h; y++) {
                        data32[y * w + x] = 0xFF000000; // Opaque black
                    }
                }
            }
            
            specCtx.putImageData(imgData, 0, 0);
        }

        function drawOverlay() {
            const w = state.canvasWidth;
            const h = state.canvasHeight;
            overlayCtx.clearRect(0, 0, w, h);

            // Determine effective cursor position (Mouse or Locked)
            const activeX = state.isLocked ? state.lockedX : state.mouseX;
            const activeY = state.isLocked ? state.lockedY : state.mouseY;
            const activeFreq = state.isLocked ? state.lockedFreq : state.mouseFreq;

            // Don't draw if mouse is out and not locked
            if (!state.isLocked && (state.mouseY < 0 || state.mouseY > h)) return;

            // 1. Crosshair
            overlayCtx.strokeStyle = state.isLocked ? '#ef4444' : 'rgba(255, 255, 255, 0.5)'; // Red if locked
            overlayCtx.lineWidth = 1;
            overlayCtx.setLineDash([4, 4]);

            // Horizontal (Freq)
            overlayCtx.beginPath();
            overlayCtx.moveTo(0, activeY);
            overlayCtx.lineTo(w, activeY);
            overlayCtx.stroke();

            // Vertical (Time)
            overlayCtx.beginPath();
            overlayCtx.moveTo(activeX, 0);
            overlayCtx.lineTo(activeX, h);
            overlayCtx.stroke();
            overlayCtx.setLineDash([]);

            // 2. Harmonics Guide
            if (document.getElementById('checkHarmonics').checked && activeFreq > 20) {
                const nyquist = config.sampleRate / 2;
                overlayCtx.fillStyle = "rgba(255, 100, 100, 0.9)";
                
                for (let k = 2; k <= 12; k++) {
                    const hFreq = activeFreq * k;
                    if (hFreq > nyquist) break;
                    
                    const hY = h * (1 - hFreq / nyquist);
                    
                    overlayCtx.beginPath();
                    overlayCtx.arc(activeX, hY, 2, 0, Math.PI*2);
                    overlayCtx.fill();
                    
                    // Draw faint line
                    overlayCtx.strokeStyle = "rgba(255, 50, 50, 0.3)";
                    overlayCtx.beginPath();
                    overlayCtx.moveTo(0, hY);
                    overlayCtx.lineTo(w, hY);
                    overlayCtx.stroke();
                    
                    // Label
                    if (activeX < w - 40) {
                         overlayCtx.font = "10px monospace";
                         overlayCtx.fillText(`x${k}`, w - 25, hY + 3);
                    }
                }
            }
        }

        function drawSpectrumSlice() {
            const ctx = sliceCtx;
            const w = sliceCanvas.width;
            const h = sliceCanvas.height;
            const historyLen = state.history.length;
            
            // Which data frame to show?
            // If locked, find the frame corresponding to lockedX
            // If not locked, find frame corresponding to mouseX
            // Or if mouse out, show latest?
            
            // Calculate index relative to screen X
            // Screen X=Width is latest visible (endIndex).
            // Screen X=0 is oldest visible.
            
            const activeX = state.isLocked ? state.lockedX : (state.mouseX > 0 ? state.mouseX : w - 1);
            
            // Same logic as renderSpec:
            // histIdx = endIndex - (w - 1 - activeX)
            const endIndex = historyLen - 1 - state.viewOffset;
            const histIdx = Math.floor(endIndex - (w - 1 - activeX));
            
            let data = null;
            if (histIdx >= 0 && histIdx < historyLen) {
                data = state.history[histIdx];
            } else if (historyLen > 0) {
                data = state.history[historyLen - 1]; // Fallback to latest
            } else {
                return; // No data
            }

            // Draw Background
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, w, h);
            
            // Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
            ctx.stroke();

            // 1. Raw Spectrum
            ctx.beginPath();
            ctx.strokeStyle = '#60a5fa'; // Blue
            ctx.lineWidth = 1;
            
            for (let i = 0; i < state.bufferLength; i++) {
                const x = (i / state.bufferLength) * w;
                const v = data[i] / 255;
                const y = h - (v * h);
                if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();

            // 2. Formants (Envelope)
            if (document.getElementById('checkFormants').checked) {
                ctx.beginPath();
                ctx.strokeStyle = '#fbbf24'; // Yellow
                ctx.lineWidth = 2;
                
                // Simple smoothing window
                const radius = 10;
                for (let i = 0; i < state.bufferLength; i+=2) { // Skip some for perf
                    let sum = 0; 
                    let cnt = 0;
                    for(let k=-radius; k<=radius; k++) {
                        if(i+k>=0 && i+k<state.bufferLength) {
                            sum += data[i+k];
                            cnt++;
                        }
                    }
                    const v = (sum/cnt) / 255;
                    const x = (i/state.bufferLength) * w;
                    const y = h - (v * h);
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
            }
            
            // 3. Frequency Marker
            const activeFreq = state.isLocked ? state.lockedFreq : state.mouseFreq;
            if (activeFreq > 0) {
                const x = (activeFreq / (config.sampleRate/2)) * w;
                ctx.strokeStyle = 'white';
                ctx.setLineDash([2,2]);
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = 'white';
                ctx.font = '10px Arial';
                ctx.fillText(Math.round(activeFreq) + "Hz", x + 4, 12);
            }
        }

        // --- Interaction Logic ---

        // 1. Mouse Tracking & Locking
        specContainer.addEventListener('mousemove', (e) => {
            const rect = specContainer.getBoundingClientRect();
            state.mouseX = e.clientX - rect.left;
            state.mouseY = e.clientY - rect.top;
            
            // Calc Frequency
            const nyquist = config.sampleRate / 2;
            state.mouseFreq = (1 - state.mouseY / rect.height) * nyquist;
            
            updateTooltip();
        });

        specContainer.addEventListener('mouseleave', () => {
            if (!state.isLocked) {
                state.mouseX = -1;
                state.mouseY = -1;
                tooltip.classList.add('hidden');
            }
        });

        // Click to Lock
        specContainer.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Left click only
            
            state.isLocked = !state.isLocked;
            
            if (state.isLocked) {
                state.lockedX = state.mouseX;
                state.lockedY = state.mouseY;
                state.lockedFreq = state.mouseFreq;
                lockIndicator.classList.remove('hidden');
                ttHint.innerText = "点击解锁";
                // Pause automatically? Maybe not, allow locking while running.
            } else {
                lockIndicator.classList.add('hidden');
                ttHint.innerText = "点击锁定";
            }
            updateTooltip();
        });

        function updateTooltip() {
            const activeFreq = state.isLocked ? state.lockedFreq : state.mouseFreq;
            const activeX = state.isLocked ? state.lockedX : state.mouseX;
            const activeY = state.isLocked ? state.lockedY : state.mouseY;

            if (activeX < 0 && !state.isLocked) {
                tooltip.classList.add('hidden');
                return;
            }

            tooltip.classList.remove('hidden');
            tooltip.style.left = (activeX + 15) + 'px';
            tooltip.style.top = (activeY + 15) + 'px';
            
            // Boundary checks
            if (activeX > state.canvasWidth - 120) tooltip.style.left = (activeX - 120) + 'px';
            if (activeY > state.canvasHeight - 60) tooltip.style.top = (activeY - 60) + 'px';

            ttFreq.innerText = Math.round(activeFreq) + " Hz";
            ttNote.innerText = getNote(activeFreq);
        }

        // 2. Slider / Timeline Logic
        function updateSlider() {
            // max is history length
            // value is history length - viewOffset
            timeSlider.max = state.history.length;
            
            if (state.viewOffset === 0) {
                timeSlider.value = state.history.length;
                btnLive.classList.replace('bg-slate-600', 'bg-blue-600');
                btnLive.innerText = "LIVE";
            } else {
                timeSlider.value = state.history.length - state.viewOffset;
                btnLive.classList.replace('bg-blue-600', 'bg-slate-600');
                btnLive.innerText = "BACK";
            }
            
            // Time Label logic (approximate)
            // 60fps? roughly.
            const fps = 60; 
            const secondsBack = state.viewOffset / fps;
            timeLabel.innerText = `-${secondsBack.toFixed(1)}s`;
        }

        timeSlider.addEventListener('input', (e) => {
            state.isPaused = true; // Dragging slider automatically pauses
            btnPause.innerHTML = '<i class="fa-solid fa-play"></i> 继续';
            btnPause.classList.add('bg-yellow-600');
            
            const val = parseInt(e.target.value);
            const max = parseInt(e.target.max);
            
            // offset = max - val
            state.viewOffset = max - val;
            if(state.viewOffset < 0) state.viewOffset = 0;
            
            updateSlider(); // Just to update label
            
            // Need explicit render call if paused
            renderSpectrogram();
            drawOverlay();
            drawSpectrumSlice();
        });

        btnLive.addEventListener('click', () => {
            state.viewOffset = 0;
            state.isPaused = false;
            btnPause.innerHTML = '<i class="fa-solid fa-pause"></i> 暂停';
            btnPause.classList.remove('bg-yellow-600');
            updateSlider();
        });

        // 3. Other Controls
        btnStart.addEventListener('click', initAudio);

        btnPause.addEventListener('click', () => {
            state.isPaused = !state.isPaused;
            if (state.isPaused) {
                btnPause.innerHTML = '<i class="fa-solid fa-play"></i> 继续';
                btnPause.classList.add('bg-yellow-600');
            } else {
                btnPause.innerHTML = '<i class="fa-solid fa-pause"></i> 暂停';
                btnPause.classList.remove('bg-yellow-600');
                // If we were looking at history, resume from LIVE?
                // Usually yes.
                state.viewOffset = 0; 
            }
        });

        btnClear.addEventListener('click', () => {
            state.history = [];
            state.isLocked = false;
            lockIndicator.classList.add('hidden');
            state.viewOffset = 0;
            renderSpectrogram();
        });

        btnSnapshot.addEventListener('click', () => {
            // Create a temp canvas to merge layers
            const tempC = document.createElement('canvas');
            tempC.width = specCanvas.width;
            tempC.height = specCanvas.height;
            const tCtx = tempC.getContext('2d');
            
            // Draw Spec
            tCtx.fillStyle = '#000';
            tCtx.fillRect(0,0,tempC.width, tempC.height);
            tCtx.drawImage(specCanvas, 0, 0);
            
            // Draw Overlay (Lines)
            tCtx.drawImage(overlayCanvas, 0, 0);
            
            // Add Timestamp/Watermark
            tCtx.fillStyle = 'white';
            tCtx.font = '12px Arial';
            tCtx.fillText('Spectrogram Analysis - ' + new Date().toLocaleTimeString(), 10, 20);
            
            // Download
            const link = document.createElement('a');
            link.download = `spectrogram-${Date.now()}.png`;
            link.href = tempC.toDataURL();
            link.click();
            
            showToast("截图已保存");
        });
        
        document.getElementById('checkHarmonics').addEventListener('change', () => {
             drawOverlay(); // redraw immediately
        });
        document.getElementById('checkFormants').addEventListener('change', () => {
             drawSpectrumSlice(); // redraw immediately
        });

        // Utils
        function getNote(frequency) {
            if (frequency < 20) return "--";
            const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const pitch = 12 * (Math.log(frequency / 440) / Math.log(2));
            const noteIndex = Math.round(pitch) + 69;
            return noteStrings[noteIndex % 12] + (Math.floor(noteIndex / 12) - 1);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                t.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

    </script>
</body>
</html>
